<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img" aria-labelledby="t d">
  <title id="t">Why a stockinette rectangle rolls into a tube</title>
  <desc id="d">Two panels. A flat rectangle of stockinette knitted fabric has both edges curling the same way, downwards. The same strip is then shown curled, with the knit side labelled on the outside of the curve and the purl side on the inside. The reason is that the knit face of stockinette is longer than the purl face, and the outside of a curve must always be the longer side.</desc>

  <rect x="8" y="8" width="664" height="344" rx="10" fill="#FAF8F5" stroke="#D8D2C8" stroke-width="2"/>

  <text x="40" y="44" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#22252A">Why a stockinette rectangle rolls into a tube</text>
  <text x="40" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6B6E76">The two faces of the same fabric are not quite the same length.</text>

  <!-- ======================= PANEL A: flat ======================= -->
  <g>
    <text x="180" y="100" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#22252A" text-anchor="middle">FLAT</text>

    <rect x="70" y="112" width="220" height="140" fill="none" stroke="#3D405B" stroke-width="2.5"/>

    <g stroke="#3D405B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 84 126 L 96 150 L 108 126"/>
      <path d="M 124 126 L 136 150 L 148 126"/>
      <path d="M 164 126 L 176 150 L 188 126"/>
      <path d="M 204 126 L 216 150 L 228 126"/>
      <path d="M 244 126 L 256 150 L 268 126"/>
    </g>
    <g stroke="#3D405B" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M 84 166 A 12 8 0 0 1 108 166"/>
      <path d="M 124 166 A 12 8 0 0 1 148 166"/>
      <path d="M 164 166 A 12 8 0 0 1 188 166"/>
      <path d="M 204 166 A 12 8 0 0 1 228 166"/>
      <path d="M 244 166 A 12 8 0 0 1 268 166"/>
    </g>
    <g stroke="#3D405B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 84 206 L 96 230 L 108 206"/>
      <path d="M 124 206 L 136 230 L 148 206"/>
      <path d="M 164 206 L 176 230 L 188 206"/>
      <path d="M 204 206 L 216 230 L 228 206"/>
      <path d="M 244 206 L 256 230 L 268 206"/>
    </g>

    <text x="90" y="134" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B6E76">knit face (RS)</text>
    <text x="90" y="222" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B6E76">purl face (WS)</text>

    <!-- curl arrows at both bottom corners -->
    <path d="M 70 252 C 56 262, 58 282, 78 284" fill="none" stroke="#B23A48" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="86,284 72,276 72,288" fill="#B23A48"/>
    <path d="M 290 252 C 304 262, 302 282, 282 284" fill="none" stroke="#B23A48" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="274,284 288,276 288,288" fill="#B23A48"/>
  </g>

  <!-- divider -->
  <line x1="340" y1="88" x2="340" y2="300" stroke="#D8D2C8" stroke-width="2"/>

  <!-- ======================= PANEL B: curled ======================= -->
  <g>
    <text x="510" y="100" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#22252A" text-anchor="middle">WHAT IT DOES</text>

    <path d="M 400 250 C 400 172, 458 122, 530 122 C 594 122, 622 162, 620 202" fill="none" stroke="#3D405B" stroke-width="16" stroke-linecap="round"/>

    <!-- knit side, outside the curve -->
    <line x1="530" y1="108" x2="530" y2="92" stroke="#2A6F97" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="530,84 524,96 536,96" fill="#2A6F97"/>
    <text x="530" y="74" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#2A6F97" text-anchor="middle">knit face</text>

    <!-- purl side, inside the curve -->
    <line x1="470" y1="206" x2="462" y2="230" stroke="#7A5195" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="460,238 455,224 468,226" fill="#7A5195"/>
    <text x="452" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#7A5195" text-anchor="middle">purl face</text>

    <text x="556" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6B6E76" text-anchor="middle">longer face</text>
    <text x="556" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6B6E76" text-anchor="middle">goes outside</text>
  </g>

  <text x="40" y="322" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#22252A">The knit face is the longer one, so the fabric bends with it on the outside.</text>
</svg>
